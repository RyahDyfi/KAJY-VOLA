name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Customise (icon, splash, orientation)
        run: bash scripts/apply-android.sh

      - name: Sync web app
        run: npx cap sync android

      - name: Build APK (signed if secrets exist, otherwise debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "Signed release build"
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
            "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../kajy-vola.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs ../kajy-vola.apk
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            echo "No signing secrets: debug build"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../kajy-vola.apk
          fi

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kajy-vola-apk
          path: kajy-vola.apk

      - name: Attach APK to release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kajy-vola.apk
