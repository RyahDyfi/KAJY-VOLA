var body=document.getElementById("rows"),last=0,g=document.getElementById("grand"),st=document.getElementById("st");
D.forEach(function(d,i){
  var r=document.createElement("div");r.className="row";r.style.setProperty("--c",C[i]);r.style.setProperty("--c2",C2[i]);if(NB[d]){r.style.setProperty("--fa","url("+NB[d][0]+")");r.style.setProperty("--do","url("+NB[d][1]+")")}

  body.appendChild(r);
});
var inputs=document.querySelectorAll("input[data-i]");
function calc(){
  var t=0;
  inputs.forEach(function(el){
    var i=+el.dataset.i,n=Math.max(0,parseInt(el.value,10)||0),s=n*D[i],c=document.getElementById("s"+i);
    c.textContent=f(s);c.classList.toggle("on",s>0);el.classList.toggle("fill",n>0);t+=s;
  });
  g.textContent=f(t)+" Ar";
  if(t!==last){g.classList.remove("pop");void g.offsetWidth;g.classList.add("pop");last=t}
}
function save(){
  var v=[];inputs.forEach(function(e){v.push(e.value)});
  try{localStorage.setItem(KEY,JSON.stringify(v));st.textContent="Voatahiry"}catch(e){st.textContent="Tsy voatahiry"}
}
function load(){
  try{var v=JSON.parse(localStorage.getItem(KEY)||"null");if(v)inputs.forEach(function(e,i){e.value=v[i]||""});}catch(e){}
}
document.addEventListener("input",function(e){if(e.target.dataset.i===undefined)return;calc();save()});

};

function saveFile(blob,name,mime,ext,label){
  var NC=window.Capacitor;
  if(NC&&NC.isNativePlatform&&NC.isNativePlatform()&&NC.Plugins&&NC.Plugins.Filesystem&&NC.Plugins.Share){
    var rd=new FileReader();
    rd.onload=function(){
      NC.Plugins.Filesystem.writeFile({path:name,data:String(rd.result).split(",")[1],directory:"CACHE"})
        .then(function(r){return NC.Plugins.Share.share({title:name,dialogTitle:name,url:r.uri})})
        .then(function(){bm.textContent="Voaray ny rakitra."})
        .catch(function(e){bm.textContent=(e&&/cancel/i.test(String(e.message||e)))?"Nofoanana.":"Tsy nahomby ny famoahana."});
    };
    rd.readAsDataURL(blob);return;
  }
  function fb(){
    var f=null;try{f=new File([blob],name,{type:mime})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      return navigator.share({files:[f],title:name}).then(function(){bm.textContent="Voaray ny rakitra."}).catch(function(e){if(!e||e.name!=="AbortError")dl();else bm.textContent="Nofoanana."});
    }
    dl();
  }
  function dl(){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();bm.textContent="Voavoaka ny rakitra (lahatahiry Downloads)."}
  if(window.showSaveFilePicker){
    var acc={};acc[mime]=[ext];
    window.showSaveFilePicker({suggestedName:name,id:"kajyvola",types:[{description:label,accept:acc}]}).then(function(h){
      return h.createWritable().then(function(w){return w.write(blob).then(function(){return w.close()})}).then(function(){bm.textContent="Voatahiry: "+h.name})
    }).catch(function(e){if(e&&e.name==="AbortError"){bm.textContent="Nofoanana.";return}fb()});
  }else fb();
}

        if(!saveP()){P.pop();busy(b,false,t);return err("Tsy afaka mitahiry ny profil.")}
        if(first)migrate(pr.id);
        enter(pr);
      });
    }
  });
  document.getElementById("lo").onclick=function(){try{sessionStorage.removeItem(SK)}catch(e){}closeProfile();home(false)};
  document.getElementById("dp").onclick=function(){
    if(CP&&confirm("Fafana tanteraka ny profil \u00ab"+CP.n+"\u00bb sy ny angony rehetra?")){
      var pr=CP;try{sessionStorage.removeItem(SK)}catch(e){}closeProfile();remove(pr);home(false)}
  };
  loadP();var sid=null;try{sid=sessionStorage.getItem(SK)}catch(e){}
  var sp=sid&&find(sid);
  if(sp)openProfile(sp);else home(false);
})();

/* Splash : logo ryah dyfi (morceaux -> logo) puis les memes morceaux se transforment en icone Kajy Vola. Tout est pilote par une seule horloge. */
(function(){
  var s=document.getElementById("splash"),done=false,cv=document.getElementById("pc"),img=document.getElementById("lgi"),T=[];
  (function(){var L=new Image();L.onload=function(){
    function cut(id,x,y,w,h){var c=document.getElementById(id);if(!c)return;c.width=w;c.height=h;c.getContext("2d").drawImage(L,x,y,w,h,0,0,w,h)}
    cut("fl1",0,0,560,320);cut("fl2",110,365,340,142)};L.src=img.src})();
  function at(ms,fn){T.push(setTimeout(fn,ms))}
  function close(){if(done)return;done=true;T.forEach(clearTimeout);s.classList.add("out");setTimeout(function(){s.remove()},700)}
  s.addEventListener("click",close);
  /* sequence simple (secours / mouvement reduit) : logo -> icone -> texte -> fermeture */
  var started=false;
  function after(){
    if(started||done)return;started=true;s.classList.remove("mo");
    img.style.opacity="1";cv.classList.add("off");
    at(900,function(){s.classList.add("p3");s.classList.add("p4")});
    at(1500,function(){s.classList.add("p5")});
    at(3300,close);
  }
  at(13500,close); /* filet de securite */
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){after();return}
  function go(){
    var W=innerWidth,H=innerHeight;cv.width=W;cv.height=H;var ctx=cv.getContext("2d");
    var r=img.getBoundingClientRect(),ow=img.naturalWidth,oh=img.naturalHeight,ic=s.querySelector(".ic"),sym=document.getElementById("kv");
    if(!ow||!r.width||!ic||!sym){after();return}
    s.classList.add("mo");
    var ir=ic.getBoundingClientRect(),R=Math.round(ir.width);
    if(!R){after();return}
    /* palette (couleurs reduites : un seul remplissage par couleur et par image) */
    var pal=[],pidx={};
    function cid(r,g,b,q){var k=Math.min(255,Math.round(r/q)*q)+","+Math.min(255,Math.round(g/q)*q)+","+Math.min(255,Math.round(b/q)*q);
      if(pidx[k]===undefined){pidx[k]=pal.length;pal.push("rgb("+k+")")}return pidx[k]}
    /* morceaux du logo ryah dyfi */
    var oc=document.createElement("canvas");oc.width=ow;oc.height=oh;var x2=oc.getContext("2d");x2.drawImage(img,0,0);
    var d=x2.getImageData(0,0,ow,oh).data,low=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3,step=Math.max(5,Math.round(ow/(low?70:88))),sc=r.width/ow,L=[];
    function A(x,y){x=Math.min(ow-1,Math.max(0,x|0));y=Math.min(oh-1,Math.max(0,y|0));return(y*ow+x)*4}
    for(var y=0;y<oh;y+=step)for(var x=0;x<ow;x+=step){
      var q=step/2,pts=[[x+q,y+q],[x+q/2,y+q/2],[x+1.5*q,y+q/2],[x+q/2,y+1.5*q],[x+1.5*q,y+1.5*q]],hit=0,col=null;
      for(var k=0;k<5;k++){var o=A(pts[k][0],pts[k][1]);if(d[o+3]>110){hit++;if(!col)col=[d[o],d[o+1],d[o+2]]}}
      if(hit<2)continue;
      var tx=r.left+(x+q)*sc,ty=r.top+(y+q)*sc,ang=Math.random()*6.283,rad=Math.max(W,H)*(.35+Math.random()*.6);
      L.push({tx:tx,ty:ty,fx:W/2+Math.cos(ang)*rad,fy:H/2+Math.sin(ang)*rad,c:cid(col[0],col[1],col[2],32),
        dl:Math.random()*400,du:850+Math.random()*450,ph:Math.random()*6.283,sw:10+Math.random()*26});
    }
    var sz=step*sc*1.12;
    /* cellules de l'icone Kajy Vola */
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="'+R+'" height="'+R+'">'+sym.innerHTML+'</svg>',im=new Image();
    im.onerror=function(){after()};
    im.onload=function(){
      if(done||started)return;
      var c3=document.createElement("canvas");c3.width=R;c3.height=R;var x3=c3.getContext("2d");x3.drawImage(im,0,0,R,R);
      var id3=x3.getImageData(0,0,R,R).data,g=sz*.92,U=[],xx,yy;
      for(yy=g/2;yy<R;yy+=g)for(xx=g/2;xx<R;xx+=g){
        var o=((yy|0)*R+(xx|0))*4;if(id3[o+3]<110)continue;
        U.push({x:ir.left+xx,y:ir.top+yy,c:cid(id3[o],id3[o+1],id3[o+2],24)});
      }
      if(U.length<30||L.length<30){after();return}
      /* appariement de haut en bas : chaque morceau du logo rejoint une cellule de l'icone */
      L.sort(function(a,b){return a.ty-b.ty||a.tx-b.tx});
      U.sort(function(a,b){return a.y-b.y||a.x-b.x});
      var N=L.length,M=U.length,K=Math.max(N,M),P=[],i;
      for(i=0;i<K;i++){
        var a=L[Math.floor(i*N/K)],u=U[Math.floor(i*M/K)];
        P.push({tx:a.tx,ty:a.ty,fx:a.fx,fy:a.fy,c:a.c,dl:a.dl,du:a.du,ph:a.ph,sw:a.sw,ux:u.x,uy:u.y,c2:u.c,md:Math.random()*200,mu:650+Math.random()*200});
      }
      var TEND=0;P.forEach(function(p){TEND=Math.max(TEND,p.dl+p.du)});
      var RV0=TEND-550,T1=TEND+2300,M0=T1+150,MEND=M0+1050;
      var B=[];for(i=0;i<pal.length;i++)B.push([]);
      function ease(t){return 1-(1-t)*(1-t)}
      function eio(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
      var clock=0,last=null,speed=1,nf=0,acc=0,f3=false,f4=false;
      started=true;
      function frame(now){
        if(done)return;
        if(last===null)last=now;
        var dt=now-last;last=now;nf++;
        /* appareil lent (moins de ~22 images/s) : on accelere la suite pour ne pas trainer */
        if(nf>6&&nf<=16)acc+=dt;
        if(nf===16&&acc/10>45)speed=2.4;
        clock+=dt*speed;
        var el=clock,j,p,t,e,w,x,y,mt,me,arr,h=sz/2;
        /* o = opacite du vrai logo : il remplace les carres (fondu croise), reste net, puis laisse revoir les carres */
        var o=el<T1?Math.min(1,Math.max(0,(el-RV0)/650)):Math.max(0,1-(el-T1)/400);
        img.style.opacity=o;
        ctx.clearRect(0,0,W,H);
        if(o<1){
          for(j=0;j<B.length;j++)B[j].length=0;
          for(j=0;j<P.length;j++){
            p=P[j];t=Math.min(1,Math.max(0,(el-p.dl)/p.du));e=ease(t);w=(1-e)*p.sw;
            x=p.fx+(p.tx-p.fx)*e+Math.sin(p.ph+el/260)*w;y=p.fy+(p.ty-p.fy)*e+Math.cos(p.ph+el/310)*w;
            mt=Math.min(1,Math.max(0,(el-M0-p.md)/p.mu));me=eio(mt);
            if(mt>0){x+=(p.ux-x)*me+Math.sin(p.ph)*Math.sin(Math.PI*mt)*14;y+=(p.uy-y)*me+Math.cos(p.ph)*Math.sin(Math.PI*mt)*14}
            arr=B[me>.5?p.c2:p.c];arr.push(x,y);
          }
          ctx.globalAlpha=Math.min(1,.25+el/300)*(1-o);
          for(j=0;j<B.length;j++){
            arr=B[j];if(!arr.length)continue;
            ctx.fillStyle=pal[j];ctx.beginPath();
            for(var k2=0;k2<arr.length;k2+=2)ctx.rect(arr[k2]-h,arr[k2+1]-h,sz,sz);
            ctx.fill();
          }
        }
        if(!f3&&el>=T1){f3=true;s.classList.add("p3")}
        if(!f4&&el>=MEND-100){f4=true;s.classList.add("p4")}
        if(el>=MEND+350){
          cv.classList.add("off");
          at(250,function(){s.classList.add("p5")});
          at(1500,close);
          return;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    };
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  }
  if(img.complete&&img.naturalWidth)go();else{img.addEventListener("load",go);img.addEventListener("error",after)}
})();
</script>
